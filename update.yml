name: 更新纳指溢价

# 定时任务用的是 UTC 时间，北京时间 = UTC+8
on:
  workflow_dispatch:            # 手机上也能手动点一下“重新抓取”
  schedule:
    - cron: '20 1 * * 1-5'      # 09:20 开盘前
    - cron: '30 2 * * 1-5'      # 10:30 上午
    - cron: '25 3 * * 1-5'      # 11:25 午间
    - cron: '30 5 * * 1-5'      # 13:30 下午开盘
    - cron: '40 6 * * 1-5'      # 14:40 尾盘前
    - cron: '55 6 * * 1-5'      # 14:55 收盘前

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓数据、算溢价
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python run.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
